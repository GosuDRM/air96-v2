name: Lint Air96 V2

on:
  push:
    branches: [master]
  pull_request:

jobs:
  cppcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install cppcheck
      run: sudo apt-get update -qq && sudo apt-get install -y cppcheck
    - name: Run cppcheck
      run: |
        cppcheck --enable=warning,performance,portability --error-exitcode=1 \
          --suppress=missingInclude --suppress=unusedFunction \
          --suppress=normalCheckLevelMaxBranches \
          --suppress=unmatchedSuppression \
          keyboards/air96_v2/ansi/*.c keyboards/air96_v2/ansi/*.h

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Clone submodule dependencies
      run: |
        git clone --depth 1 https://github.com/qmk/ChibiOS lib/chibios
        git -C lib/chibios fetch --depth 1 origin b95228cc3ac7ac4e7e8ae5a4a076c316905e032d
        git -C lib/chibios checkout b95228cc3ac7ac4e7e8ae5a4a076c316905e032d
        git clone --depth 1 https://github.com/qmk/ChibiOS-Contrib lib/chibios-contrib
        git clone --depth 1 https://github.com/qmk/lufa lib/lufa
        git clone --depth 1 https://github.com/qmk/v-usb lib/vusb
        git clone --depth 1 https://github.com/qmk/printf lib/printf

    - name: Install deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y gcc-arm-none-eabi clang-tidy
        python3 -m pip install -r requirements.txt
        python3 -m pip install qmk
    - name: Generate compile database
      run: qmk generate-compilation-database -kb air96_v2/ansi -km default
    - name: Build generated headers
      run: qmk compile -kb air96_v2/ansi -km default
    - name: Run clang-tidy correctness checks
      run: python3 util/lint_air96.py
