name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Clone submodule dependencies
      run: |
        # Pin ChibiOS to last pre-halconf-9_1_ commit (qmk-master HEAD moved past this)
        git clone --depth 1 https://github.com/qmk/ChibiOS lib/chibios
        git -C lib/chibios fetch --depth 1 origin b95228cc3ac7ac4e7e8ae5a4a076c316905e032d
        git -C lib/chibios checkout b95228cc3ac7ac4e7e8ae5a4a076c316905e032d
        git clone --depth 1 https://github.com/qmk/ChibiOS-Contrib lib/chibios-contrib
        git clone --depth 1 https://github.com/qmk/lufa lib/lufa
        git clone --depth 1 https://github.com/qmk/v-usb lib/vusb
        git clone --depth 1 https://github.com/qmk/printf lib/printf

    - name: Install system deps
      run: sudo apt-get update -qq && sudo apt-get install -y gcc-arm-none-eabi dfu-util

    - name: Install QMK and python deps
      run: |
        python3 -m pip install -r requirements.txt
        python3 -m pip install qmk

    - name: Regression tests
      run: |
        for test in tests/air96_*_test.py; do python3 "$test"; done

    - name: Compile Air96 V2
      run: |
        qmk compile -kb air96_v2/ansi -km default
        qmk compile -kb air96_v2/ansi -km via

    - name: Rename binaries
      run: |
        mv air96_v2_ansi_default.bin air96-v2-c-${{ github.ref_name }}.bin
        mv air96_v2_ansi_via.bin air96-v2-via-${{ github.ref_name }}.bin

    - name: Extract changelog
      run: |
        VERSION="${{ github.ref_name }}"
        awk -v ver="$VERSION" '
          $0 ~ "^## " ver { found=1; print; next }
          /^## v/ { found=0 }
          found { print }
        ' CHANGELOG.md > /tmp/release_notes.md
        cat /tmp/release_notes.md

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: NuPhy Air96 V2 Firmware ${{ github.ref_name }}
        body_path: /tmp/release_notes.md
        fail_on_unmatched_files: true
        files: |
          air96-v2-c-${{ github.ref_name }}.bin
          air96-v2-via-${{ github.ref_name }}.bin
